services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: adolat_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adolat_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - adolat_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: adolat_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - adolat_net

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: adolat-api:latest
    container_name: adolat_api
    restart: always
    env_file: ../apps/api/.env.prod
    networks:
      - adolat_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args:
        # NEXT_PUBLIC_* build vaqtida inline qilinadi (client kodga kiradi).
        NEXT_PUBLIC_API_URL: ${API_URL}
    image: adolat-admin:latest
    container_name: adolat_admin
    restart: always
    environment:
      PORT: 3001
    networks:
      - adolat_net
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: adolat_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - ../docs/store/privacy-policy.html:/usr/share/nginx/html/privacy.html:ro
    networks:
      - adolat_net
    depends_on:
      - api
      - admin

volumes:
  postgres_data:
  redis_data:

networks:
  adolat_net:
    driver: bridge
