# ============================================================
# Adolat AI — nginx (reverse proxy + TLS)
# <DOMEN> ni o'z domeningizga almashtiring (masalan: adolat.uz).
# TLS sertifikatlari ./nginx/ssl ichida bo'lishi kutiladi:
#   ./nginx/ssl/fullchain.pem, ./nginx/ssl/privkey.pem
# (Let's Encrypt uchun DEPLOYMENT.md ga qarang.)
# ============================================================
worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  upstream api {
    server api:4000;
    keepalive 32;
  }

  upstream admin {
    server admin:3001;
  }

  # ---- HTTP: ACME challenge + HTTPS'ga yo'naltirish ----
  server {
    listen 80;
    server_name api.<DOMEN> admin.<DOMEN> <DOMEN>;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---- HTTPS: API ----
  server {
    listen 443 ssl;
    http2 on;
    server_name api.<DOMEN>;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ---- HTTPS: Admin ----
  server {
    listen 443 ssl;
    http2 on;
    server_name admin.<DOMEN>;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
      proxy_pass http://admin;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
