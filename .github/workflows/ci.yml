name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (API) — build, test, e2e, lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adolat_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adolat_ai?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_key_1234567890
      JWT_REFRESH_SECRET: ci_refresh_secret_key_1234567890
      ADMIN_DEFAULT_EMAIL: admin@ci.test
      ADMIN_DEFAULT_PASSWORD: Admin12345!
      AI_ENABLE_TEST_ENDPOINT: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run shared:build

      - name: Prisma generate
        run: npm run prisma:generate --workspace=apps/api

      - name: Apply migrations
        run: npm run prisma:deploy --workspace=apps/api

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Run API unit tests (with coverage)
        run: npm run test:cov --workspace=apps/api

      - name: Run API e2e tests
        run: npm run test:e2e --workspace=apps/api

      - name: Lint API
        run: npm run lint --workspace=apps/api

  admin:
    name: Admin panel — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run shared:build

      - name: Build admin
        run: npm run build --workspace=apps/admin

  mobile:
    name: Mobile (Flutter) — analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test
