name: adolat_ai
description: Adolat AI — Professional legal-tech AI platform for Uzbekistan.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  easy_localization: ^3.0.7
  intl: ^0.20.2
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  google_fonts: ^6.2.1
  connectivity_plus: ^6.0.5
  file_picker: ^8.1.2
  record: ^5.1.2
  just_audio: ^0.9.40
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  cached_network_image: ^3.3.1
  share_plus: ^9.0.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/translations/
